# Builds the portal and checks its packages for known vulnerabilities (OWASP A03 / A08).
# Runs on every push and pull request, and every Monday morning.
# On the first run it uploads package-lock.json as an artifact: commit that file to pin versions.
name: Build and security check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Save lockfile (until one is committed)
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - name: Check for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-only
        run: npm run build
